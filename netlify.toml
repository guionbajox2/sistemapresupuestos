# netlify.toml — Configuración del proyecto para Netlify

[build]
  # No hay comando de build (sitio estático + Functions)
  publish = "."
  command = ""

[functions]
  # Directorio donde viven las Netlify Functions
  directory = "netlify/functions"
  # Tiempo máximo de ejecución (segundos). Máximo en plan free: 10s
  node_bundler = "esbuild"

# Redirección para que el fetch desde el frontend apunte a la función
[[redirects]]
  from   = "/.netlify/functions/*"
  to     = "/.netlify/functions/:splat"
  status = 200

# Headers de seguridad para el sitio estático
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options         = "DENY"
    X-Content-Type-Options  = "nosniff"
    Referrer-Policy         = "strict-origin-when-cross-origin"
    Permissions-Policy      = "camera=(), microphone=(), geolocation=()"

# Variables de entorno para el entorno de desarrollo local
[dev]
  command   = ""
  port      = 8888
  targetPort= 3000
  publish   = "."
